<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio CMS | Eddy Biegon</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin.css"></head>
<body class="admin-body">
<header class="admin-top"><a class="brand" href="/">EDDY<span>.</span></a><div><a class="btn" href="/" target="_blank">View site ↗</a><form action="/admin/logout" method="post" class="inline"><button class="btn" type="submit">Log out</button></form></div></header>
<main class="admin-shell">
<section class="admin-intro"><div><div class="eyebrow">Portfolio CMS</div><h1>Manage your portfolio.</h1><p>Add or edit projects, certifications and TryHackMe/cyber activities. Changes appear on the public site immediately.</p></div><button id="refresh-data" class="btn">Refresh</button></section>
<nav class="admin-tabs"><button class="active" data-tab="projects">Projects</button><button data-tab="certifications">Certifications</button><button data-tab="cyber_activities">Cyber Lab</button></nav>
<section id="cms-status" class="cms-status" aria-live="polite"></section>
<section id="panel-projects" class="admin-panel active"><div class="admin-grid"><div><h2 id="project-form-title">Add project</h2><form id="project-form" class="admin-form"><input type="hidden" name="id"><label>Title<input name="title" required></label><label>Label / eyebrow<input name="eyebrow" placeholder="Web / Infrastructure"></label><label>Summary<textarea name="summary" rows="4"></textarea></label><div class="two"><label>Category<select name="category"><option value="web">Web</option><option value="security">Security</option><option value="systems">Systems</option></select></label><label>Tags<input name="tags" placeholder="WordPress,Virtualmin,Apache"></label></div><label>Project URL<input name="url" type="url" placeholder="https://..."></label><label>Preview image URL<input name="image_url" type="url" placeholder="https://..."></label><div class="two"><label>Sort order<input name="sort_order" type="number" value="100"></label><label class="check"><input name="featured" type="checkbox"> Featured on homepage</label></div><label class="check"><input name="published" type="checkbox" checked> Published</label><div class="form-actions"><button class="btn primary" type="submit">Save project</button><button class="btn reset-form" type="button">Clear</button></div></form></div><div><h2>Current projects</h2><div id="project-list" class="cms-list"></div></div></div></section>
<section id="panel-certifications" class="admin-panel"><div class="admin-grid"><div><h2>Add certification</h2><form id="cert-form" class="admin-form"><input type="hidden" name="id"><label>Title<input name="title" required></label><div class="two"><label>Issuer<input name="issuer"></label><label>Date<input name="date_text" placeholder="2025"></label></div><label>Summary<textarea name="summary" rows="3"></textarea></label><label>Credential URL<input name="credential_url" type="url"></label><label>Image URL<input name="image_url" type="url"></label><label>Sort order<input name="sort_order" type="number" value="100"></label><label class="check"><input name="published" type="checkbox" checked> Published</label><div class="form-actions"><button class="btn primary" type="submit">Save certification</button><button class="btn reset-form" type="button">Clear</button></div></form></div><div><h2>Current certifications</h2><div id="cert-list" class="cms-list"></div></div></div></section>
<section id="panel-cyber_activities" class="admin-panel"><div class="admin-grid"><div><h2>Add cyber activity</h2><form id="activity-form" class="admin-form"><input type="hidden" name="id"><label>Room / activity title<input name="title" required></label><div class="two"><label>Type<input name="activity_type" value="TryHackMe Room"></label><label>Status<select name="status"><option>Completed</option><option>In progress</option><option>Planned</option></select></label></div><label>Summary<textarea name="summary" rows="3"></textarea></label><label>TryHackMe / evidence URL<input name="url" type="url"></label><div class="two"><label>Completed date<input name="completed_date" placeholder="Sep 2026"></label><label>Sort order<input name="sort_order" type="number" value="100"></label></div><label class="check"><input name="published" type="checkbox" checked> Published</label><div class="form-actions"><button class="btn primary" type="submit">Save activity</button><button class="btn reset-form" type="button">Clear</button></div></form></div><div><h2>Cyber activity</h2><div id="activity-list" class="cms-list"></div></div></div></section>
</main><script src="/admin.js"></script></body></html>
